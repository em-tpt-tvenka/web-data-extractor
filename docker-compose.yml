services:
  redis:
    image: redis:7-alpine
    container_name: web-data-extractor-redis
    # Host port 6380 to avoid colliding with other Redis containers already
    # running on 6379/16379. The app connects via the URLs in .env.
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
